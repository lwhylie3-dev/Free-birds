<title>Eclipse G2 POV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed first-person scene; HUD locked to the head, world sways behind it; controls float at the bottom. */
:root {
  --night: #05070a;          /* room and frame */
  --hud: #5dff7a;            /* G2 micro-LED green */
  --hud-dim: rgba(93, 255, 122, .42);
  --hud-glow: rgba(93, 255, 122, .55);
  --alert: #b9ffc6;
  --caption: #f2f4f1;
  --chrome: rgba(16, 20, 24, .78);
  --chrome-line: rgba(255, 255, 255, .12);
  --font-hud: "Quicksand", "Varela Round", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--caption); font-family: var(--font-ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter .7s ease; }
body.reading #world { filter: blur(.9px) brightness(.9); }

/* Glasses frame: out of focus because it sits 2 cm from the eye. */
#frame { position: absolute; inset: 0; pointer-events: none; }
#frame svg { width: 100%; height: 100%; filter: blur(7px); }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 95% at 50% 46%, transparent 55%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%); }

/* The lens display: 576×288 per eye, monochrome green, one rounded firmware-style face. */
#hud { position: absolute; left: 50%; top: 40%; width: min(64vw, 640px); aspect-ratio: 2 / 1; max-width: calc(100% - 32px);
  transform: translate(-50%, -50%); font-family: var(--font-hud); font-weight: 500; color: var(--hud);
  font-size: calc(var(--hudw, 600px) / 25); line-height: 1.38; letter-spacing: .01em;
  text-shadow: 0 0 6px var(--hud-glow), 0 0 18px rgba(93,255,122,.18); pointer-events: none;
  mix-blend-mode: screen; opacity: .95; }
#hud .ln { white-space: pre-wrap; min-height: 1.38em; transition: opacity .35s ease, transform .35s ease; }
#hud .ln.new { opacity: 0; transform: translateY(.3em); }
#hud .dim { color: var(--hud-dim); }
#hud .sel::before { content: "› "; }
#hud .urgent { color: var(--alert); animation: pulse 1.1s ease-in-out infinite; }
#hud .caret::after { content: "▍"; animation: caret .8s steps(2) infinite; margin-left: .05em; }
#hud .big { font-size: 2.6em; font-weight: 600; line-height: 1.1; letter-spacing: .04em; }
#hud .bar { letter-spacing: -.02em; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes caret { 50% { opacity: 0; } }
/* Faint micro-LED shimmer */
#hud::after { content: ""; position: absolute; inset: -4%; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; opacity: .5; }

/* Real-world captions (outside the lens display) */
#captions { position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
body.rec #captions { bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
.say { max-width: 46ch; text-align: center; font-size: clamp(15px, 2vw, 21px); font-weight: 500; line-height: 1.4; text-wrap: balance;
  text-shadow: 0 1px 3px #000, 0 0 14px #000; transition: opacity .4s; }
.say b { font-weight: 600; color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--chrome);
  border: 1px solid var(--chrome-line); font-size: 13px; letter-spacing: .02em; transition: opacity .3s; backdrop-filter: blur(8px); }
.chip i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hud); box-shadow: 0 0 8px var(--hud-glow); }
.hide { opacity: 0; }

#tag { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); pointer-events: none; }
#tag b { color: var(--hud); font-weight: 600; }

/* Controls */
#controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(transparent, rgba(0,0,0,.75)); }
body.rec #controls { display: none; }
#controls button, #ask input { font: 500 14px/1 var(--font-ui); color: var(--caption); background: var(--chrome); border: 1px solid var(--chrome-line);
  border-radius: 999px; padding: 10px 14px; min-height: 40px; cursor: pointer; backdrop-filter: blur(8px); }
#controls button:hover { border-color: var(--hud-dim); }
#controls button:focus-visible, #ask input:focus-visible { outline: 2px solid var(--hud); outline-offset: 2px; }
#controls button.primary { color: #03140a; background: var(--hud); border-color: var(--hud); font-weight: 600; }
#ask { display: flex; gap: 8px; flex: 1 1 260px; max-width: 420px; min-width: 0; }
#ask input { flex: 1; min-width: 0; cursor: text; border-radius: 12px; }
#hint { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: rgba(255,255,255,.45); pointer-events: none; }
body.rec #hint { display: none; }
@media (max-width: 520px) { #hud { width: calc(100% - 32px); top: 34%; } #hint { display: none; } }
</style>

<div id="stage" aria-label="First-person view through Even G2 glasses at the Eclipse desk">
  <canvas id="world"></canvas>
  <div id="hud" role="log" aria-live="polite"></div>
  <div id="vignette"></div>
  <div id="frame">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <!-- Rim of the right lens and the bridge, seen out of focus from behind -->
      <path d="M-40 -40 H1640 V940 H-40 Z M60 120 Q60 40 180 40 H1420 Q1540 40 1540 140 V700 Q1540 860 1380 860 H980 Q900 860 860 820 Q800 770 740 820 Q700 860 620 860 H220 Q60 860 60 700 Z"
            fill="#020304" fill-rule="evenodd" opacity=".92"/>
    </svg>
  </div>
  <div id="tag"><b>G2</b> · Eclipse · simulated view</div>
  <div id="hint">Drag to look around</div>
  <div id="captions">
    <div id="ring" class="chip hide"><i></i><span id="ringText">R1 ring</span></div>
    <div id="say" class="say hide"></div>
  </div>
  <div id="controls">
    <button type="button" class="primary" id="demo">Play demo</button>
    <button type="button" data-cmd="phone">Find &amp; charge my phone</button>
    <button type="button" data-cmd="next">What's next?</button>
    <button type="button" data-cmd="focus">Focus 25 min</button>
    <button type="button" data-cmd="stand">Stand reminder</button>
    <form id="ask"><input id="askInput" type="text" placeholder="Ask Eclipse anything…" aria-label="Ask Eclipse" autocomplete="off"><button type="submit">Ask</button></form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const REC = location.hash === "#rec";
  if (REC) document.body.classList.add("rec");
  const $ = (id) => document.getElementById(id);

  // ---------------- 3D world ----------------
  const canvas = $("world");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07090c);
  scene.fog = new THREE.Fog(0x07090c, 3.5, 8);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.02, 30);

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); draw(g, w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    t.userData = { c, g }; return t;
  }
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  // Room
  const room = new THREE.Mesh(new THREE.BoxGeometry(6, 3.2, 6), new THREE.MeshStandardMaterial({ color: 0x15181d, roughness: .95, side: THREE.BackSide }));
  room.position.set(0, 1.6, -1); scene.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ color: 0x0e0f11, roughness: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0.001, -1); scene.add(floor);
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshStandardMaterial({ color: 0x08090b, roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.003, -0.3); scene.add(rug);

  // Window: dusk city
  const winTex = canvasTex(1024, 512, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#0b1430"); sky.addColorStop(.55, "#3a2a55"); sky.addColorStop(.8, "#c4643f"); sky.addColorStop(1, "#f0a35a");
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const r = rng(7);
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${.3 + r() * .6})`; g.fillRect(r() * w, r() * h * .4, 1.5, 1.5); }
    for (let x = 0; x < w;) {
      const bw = 30 + r() * 70, bh = h * (.25 + r() * .5);
      g.fillStyle = "#0a0b12"; g.fillRect(x, h - bh, bw, bh);
      for (let y = h - bh + 8; y < h - 6; y += 12) for (let xx = x + 5; xx < x + bw - 6; xx += 10)
        if (r() < .35) { g.fillStyle = r() < .8 ? "rgba(255,200,120,.85)" : "rgba(140,200,255,.8)"; g.fillRect(xx, y, 5, 6); }
      x += bw + 2;
    }
  });
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.3), new THREE.MeshBasicMaterial({ map: winTex }));
  win.position.set(-0.3, 1.75, -3.98); scene.add(win);
  const mull = new THREE.MeshStandardMaterial({ color: 0x0d0f12 });
  [[0, 0, 2.7, .05], [0, -.66, 2.7, .06], [0, .66, 2.7, .06], [-.65, 0, .04, 1.36], [.65, 0, .04, 1.36]].forEach(([x, y, w, h]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, .04), mull); m.position.set(-0.3 + x, 1.75 + y, -3.96); scene.add(m);
  });

  // Lights
  scene.add(new THREE.HemisphereLight(0x8899cc, 0x221a14, .55));
  const dusk = new THREE.DirectionalLight(0xffa26b, .6); dusk.position.set(-1, 2, -4); scene.add(dusk);
  const lamp = new THREE.PointLight(0xffc98a, 1.3, 3.2, 2); lamp.position.set(0.62, 1.3, -0.55); scene.add(lamp);
  const deskGlow = new THREE.PointLight(0x5dff7a, 0.0, 1.2, 2); deskGlow.position.set(0, 0.68, -0.3); scene.add(deskGlow);

  // Desk: metal frame, gantry under the glass, transparent OLED, glass top
  const DESK = { w: 1.5, d: 0.75, y: 0.74, z: -0.38 };
  const uv2w = (u, v, y = DESK.y) => new THREE.Vector3((u - .5) * DESK.w, y, DESK.z + (v - .5) * DESK.d);
  const metal = new THREE.MeshStandardMaterial({ color: 0x23272d, metalness: .7, roughness: .35 });
  const frameBox = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), metal); m.position.set(x, y, z); scene.add(m); return m; };
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => frameBox(.04, DESK.y - .03, .04, sx * (DESK.w / 2 - .03), (DESK.y - .03) / 2, DESK.z + sz * (DESK.d / 2 - .03)));
  frameBox(DESK.w, .04, .04, 0, DESK.y - .07, DESK.z - DESK.d / 2 + .02);
  frameBox(DESK.w, .04, .04, 0, DESK.y - .07, DESK.z + DESK.d / 2 - .02);
  // Gantry rails + carriage + Qi coil
  const railX = frameBox(DESK.w - .1, .015, .02, 0, DESK.y - .1, DESK.z);
  const carriage = new THREE.Group(); scene.add(carriage);
  const cBody = new THREE.Mesh(new THREE.BoxGeometry(.11, .02, .11), new THREE.MeshStandardMaterial({ color: 0x30353c, metalness: .5, roughness: .4 }));
  const coil = new THREE.Mesh(new THREE.TorusGeometry(.038, .006, 10, 40), new THREE.MeshStandardMaterial({ color: 0xc58b4a, emissive: 0x5dff7a, emissiveIntensity: .0, metalness: .9, roughness: .3 }));
  coil.rotation.x = Math.PI / 2; coil.position.y = .016; carriage.add(cBody, coil);
  const railY = frameBox(.015, .015, DESK.d - .1, 0, DESK.y - .085, DESK.z);

  // OLED layer: additive blending, so black pixels stay clear glass
  const OW = 1024, OH = 512;
  const oledTex = canvasTex(OW, OH, (g) => { g.fillStyle = "#000"; g.fillRect(0, 0, OW, OH); });
  const oled = new THREE.Mesh(new THREE.PlaneGeometry(DESK.w - .04, DESK.d - .04),
    new THREE.MeshBasicMaterial({ map: oledTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  oled.rotation.x = -Math.PI / 2; oled.position.set(0, DESK.y - .006, DESK.z); scene.add(oled);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(DESK.w, .012, DESK.d),
    new THREE.MeshStandardMaterial({ color: 0x9fb3b8, transparent: true, opacity: .16, metalness: .2, roughness: .05 }));
  glass.position.set(0, DESK.y, DESK.z); scene.add(glass);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(glass.geometry), new THREE.LineBasicMaterial({ color: 0x9fd8c0, transparent: true, opacity: .35 }));
  edge.position.copy(glass.position); scene.add(edge);

  // Things on the desk
  const PHONE_UV = { u: .2, v: .62 };
  const phoneTex = canvasTex(128, 256, (g) => { g.fillStyle = "#000"; g.fillRect(0, 0, 128, 256); });
  const phone = new THREE.Group();
  phone.add(new THREE.Mesh(new THREE.BoxGeometry(.074, .009, .152), new THREE.MeshStandardMaterial({ color: 0x0c0d0f, metalness: .6, roughness: .3 })));
  const pScreen = new THREE.Mesh(new THREE.PlaneGeometry(.068, .145), new THREE.MeshBasicMaterial({ map: phoneTex }));
  pScreen.rotation.x = -Math.PI / 2; pScreen.position.y = .0047; phone.add(pScreen);
  phone.position.copy(uv2w(PHONE_UV.u, PHONE_UV.v, DESK.y + .011)); phone.rotation.y = .25; scene.add(phone);

  const kb = new THREE.Mesh(new THREE.BoxGeometry(.42, .018, .13), new THREE.MeshStandardMaterial({ color: 0x2b2f35, roughness: .6 }));
  kb.position.copy(uv2w(.5, .86, DESK.y + .015)); scene.add(kb);
  const keysTex = canvasTex(256, 80, (g, w, h) => { g.fillStyle = "#2b2f35"; g.fillRect(0, 0, w, h); g.fillStyle = "#3b4048";
    for (let r = 0; r < 4; r++) for (let c = 0; c < 15; c++) g.fillRect(4 + c * 16.6, 4 + r * 18.5, 13, 15); });
  const keys = new THREE.Mesh(new THREE.PlaneGeometry(.41, .12), new THREE.MeshStandardMaterial({ map: keysTex, roughness: .7 }));
  keys.rotation.x = -Math.PI / 2; keys.position.copy(uv2w(.5, .86, DESK.y + .025)); scene.add(keys);

  const mug = new THREE.Mesh(new THREE.CylinderGeometry(.04, .036, .1, 24), new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: .5 }));
  mug.position.copy(uv2w(.86, .6, DESK.y + .056)); scene.add(mug);

  // Monitor with an editor on it
  const monTex = canvasTex(1024, 576, (g, w, h) => {
    g.fillStyle = "#0e1217"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#151b22"; g.fillRect(0, 0, 200, h); g.fillRect(0, 0, w, 34);
    g.font = "18px monospace"; g.fillStyle = "#7f8a99"; g.fillText("eclipse/desk/agent.py", 220, 23);
    const r = rng(3), cols = ["#7cc4ff", "#c792ea", "#9ad38b", "#e6c07b", "#a6b0bf"];
    for (let i = 0; i < 24; i++) { let x = 230 + (i % 5 === 0 ? 0 : 30 + (r() < .5 ? 30 : 0)); const y = 60 + i * 21;
      g.fillStyle = "#3a4250"; g.fillText(String(i + 1).padStart(3), 160, y + 12);
      for (let k = 0; k < 1 + r() * 4; k++) { const len = 30 + r() * 140; g.fillStyle = cols[(r() * cols.length) | 0]; g.fillRect(x, y, len, 10); x += len + 12; } }
    for (let i = 0; i < 14; i++) { g.fillStyle = i === 2 ? "#2a3340" : "transparent"; g.fillRect(0, 50 + i * 26, 200, 24); g.fillStyle = "#7f8a99"; g.fillRect(20, 58 + i * 26, 60 + (i * 37) % 90, 8); }
  });
  const mon = new THREE.Group();
  mon.add(new THREE.Mesh(new THREE.BoxGeometry(.72, .42, .025), new THREE.MeshStandardMaterial({ color: 0x111317, metalness: .4 })));
  const monScreen = new THREE.Mesh(new THREE.PlaneGeometry(.69, .39), new THREE.MeshBasicMaterial({ map: monTex }));
  monScreen.position.z = .0131; mon.add(monScreen);
  const stand = new THREE.Mesh(new THREE.BoxGeometry(.04, .2, .04), metal); stand.position.set(0, -.27, -.03); mon.add(stand);
  mon.position.copy(uv2w(.52, .1, DESK.y + .38)); scene.add(mon);
  const screenFill = new THREE.PointLight(0x6f9bd1, .35, 1.4, 2); screenFill.position.copy(mon.position).add(new THREE.Vector3(0, 0, .25)); scene.add(screenFill);

  // Lamp
  const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(.06, .07, .02, 24), metal); lampBase.position.copy(uv2w(.9, .22, DESK.y + .01)); scene.add(lampBase);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, .6, 8), metal); arm.position.copy(uv2w(.9, .22, DESK.y + .3)); scene.add(arm);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(.07, .09, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x15181c, emissive: 0xffc98a, emissiveIntensity: .06, metalness: .5, roughness: .4, side: THREE.DoubleSide }));
  shade.position.set(lamp.position.x - .02, lamp.position.y + .05, lamp.position.z); shade.rotation.z = .35; scene.add(shade);

  // Chair back hint and a plant for depth
  const plantPot = new THREE.Mesh(new THREE.CylinderGeometry(.13, .1, .3, 20), new THREE.MeshStandardMaterial({ color: 0x2d2622 }));
  plantPot.position.set(-1.6, .15, -2.6); scene.add(plantPot);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x24442c, roughness: .8 });
  const lr = rng(11);
  for (let i = 0; i < 16; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(.09 + lr() * .05, 8, 6), leafMat);
    l.position.set(-1.6 + (lr() - .5) * .4, .45 + lr() * .7, -2.6 + (lr() - .5) * .4); l.scale.y = 1.6; scene.add(l); }

  // ---------------- Desk state (mirrors the real Eclipse desk agent) ----------------
  const desk = { coil: { u: .7, v: .42 }, target: null, charge: "idle", pct: 41, focus: false, scan: -1, nudge: false, catBlink: 0, msg: "" };
  const lerp = (a, b, t) => a + (b - a) * t;

  function drawOled(t) {
    const g = oledTex.userData.g;
    g.fillStyle = "#000"; g.fillRect(0, 0, OW, OH);
    const dimK = desk.focus ? .28 : 1;
    const cx = desk.coil.u * OW, cy = desk.coil.v * OH;
    // Charging ring around the coil
    if (desk.charge !== "idle") {
      const pulse = desk.charge === "charging" ? (Math.sin(t * 3) * .5 + .5) : 1;
      g.strokeStyle = desk.charge === "seeking" ? `rgba(255,200,90,${.8 * dimK})` : `rgba(93,255,122,${(.45 + .45 * pulse) * dimK})`;
      g.lineWidth = 5; g.beginPath(); g.arc(cx, cy, 62 + pulse * 8, 0, Math.PI * 2); g.stroke();
      if (desk.charge === "charging") {
        g.strokeStyle = `rgba(93,255,122,${.95 * dimK})`; g.lineWidth = 7; g.beginPath();
        g.arc(cx, cy, 82, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * desk.pct / 100); g.stroke();
        g.fillStyle = `rgba(93,255,122,${.9 * dimK})`; g.font = "600 26px Quicksand, sans-serif"; g.textAlign = "center";
        g.fillText(`${Math.round(desk.pct)}%`, cx, cy + 122);
      }
    }
    // Scan sweep while the camera looks for the phone
    if (desk.scan >= 0) {
      const x = desk.scan * OW; const grd = g.createLinearGradient(x - 120, 0, x, 0);
      grd.addColorStop(0, "rgba(93,255,122,0)"); grd.addColorStop(1, "rgba(93,255,122,.55)");
      g.fillStyle = grd; g.fillRect(x - 120, 0, 120, OH);
    }
    // The cat rides just behind the coil
    const catX = cx, catY = cy - 120;
    const walking = !!desk.target, bob = walking ? Math.sin(t * 14) * 4 : 0;
    g.save(); g.translate(catX, catY + bob); g.globalAlpha = desk.focus ? .3 : 1;
    g.strokeStyle = "#7cf29a"; g.lineWidth = 4.5; g.lineCap = g.lineJoin = "round";
    g.beginPath(); g.moveTo(-38, 30); g.quadraticCurveTo(-40, 0, -20, -6); g.lineTo(-16, -26); g.lineTo(-4, -10);
    g.quadraticCurveTo(0, -12, 8, -10); g.lineTo(20, -26); g.lineTo(24, -6); g.quadraticCurveTo(42, 0, 38, 30); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(38, 26); g.quadraticCurveTo(58 + Math.sin(t * 2) * 6, 20, 54, 0); g.stroke();
    const blink = (t % 4) < .12; g.fillStyle = "#7cf29a";
    if (blink) { g.fillRect(-14, 9, 9, 2); g.fillRect(6, 9, 9, 2); } else { g.beginPath(); g.arc(-10, 10, 3.5, 0, 7); g.arc(10, 10, 3.5, 0, 7); g.fill(); }
    g.beginPath(); g.moveTo(-4, 20); g.quadraticCurveTo(0, 24, 4, 20); g.stroke();
    g.restore();
    // Messages on the glass
    if (desk.nudge) {
      g.globalAlpha = .6 + .4 * Math.sin(t * 5); g.fillStyle = "#7cf29a"; g.font = "600 54px Quicksand, sans-serif"; g.textAlign = "center";
      g.fillText("STAND · STRETCH · WATER", OW / 2, OH * .42); g.globalAlpha = 1;
    } else if (desk.msg && !desk.focus) {
      g.fillStyle = "rgba(124,242,154,.85)"; g.font = "500 30px Quicksand, sans-serif"; g.textAlign = "left"; g.fillText(desk.msg, 40, 56);
    }
    if (desk.focus) { g.fillStyle = "rgba(124,242,154,.35)"; g.font = "500 26px Quicksand, sans-serif"; g.textAlign = "right"; g.fillText("focus", OW - 30, OH - 26); }
    oledTex.needsUpdate = true;
  }

  function drawPhone(t) {
    const g = phoneTex.userData.g; g.fillStyle = "#000"; g.fillRect(0, 0, 128, 256);
    if (desk.charge === "charging") {
      g.strokeStyle = "#39d065"; g.lineWidth = 6; g.beginPath(); g.arc(64, 118, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * desk.pct / 100); g.stroke();
      g.fillStyle = "#e9ffe9"; g.font = "600 22px Inter, sans-serif"; g.textAlign = "center"; g.fillText(`${Math.round(desk.pct)}%`, 64, 126);
      g.fillStyle = "#cfd3d8"; g.font = "500 15px Inter, sans-serif"; g.fillText(clock(), 64, 40);
    }
    phoneTex.needsUpdate = true;
  }

  // ---------------- Camera: seated head, sway, drag-to-look, scripted glances ----------------
  const head = { pos: new THREE.Vector3(0, 1.24, .52), look: new THREE.Vector3(0, .86, -.7) };
  const want = { pos: head.pos.clone(), look: head.look.clone() };
  const HOME = { pos: head.pos.clone(), look: head.look.clone() };
  const drag = { yaw: 0, pitch: 0, vy: 0, vp: 0, down: false, x: 0, y: 0 };
  canvas.addEventListener("pointerdown", (e) => { drag.down = true; drag.x = e.clientX; drag.y = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => { if (!drag.down) return; drag.yaw -= (e.clientX - drag.x) * .004; drag.pitch -= (e.clientY - drag.y) * .003;
    drag.yaw = Math.max(-1.1, Math.min(1.1, drag.yaw)); drag.pitch = Math.max(-.6, Math.min(.5, drag.pitch)); drag.x = e.clientX; drag.y = e.clientY; });
  canvas.addEventListener("pointerup", () => { drag.down = false; });
  function glance(look, pos) { want.look.copy(look); if (pos) want.pos.copy(pos); }
  function homeView() { want.look.copy(HOME.look); want.pos.copy(HOME.pos); }

  function resize() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 1 ? 78 : 62; camera.updateProjectionMatrix();
    document.documentElement.style.setProperty("--hudw", $("hud").getBoundingClientRect().width + "px");
  }
  addEventListener("resize", resize); resize();

  const clock0 = performance.now();
  let last = clock0;
  function frame() {
    const now = performance.now();
    const t = (now - clock0) / 1000, dt = Math.min(.1, (now - last) / 1000); last = now;
    // Coil follows its target, cat follows the coil
    if (desk.target) {
      const k = Math.min(1, dt * 1.6);
      desk.coil.u = lerp(desk.coil.u, desk.target.u, k); desk.coil.v = lerp(desk.coil.v, desk.target.v, k);
      if (Math.hypot(desk.coil.u - desk.target.u, desk.coil.v - desk.target.v) < .004) { desk.coil = { ...desk.target }; desk.target = null; }
    }
    if (desk.charge === "charging") desk.pct = Math.min(100, desk.pct + dt * .9);
    const cp = uv2w(desk.coil.u, desk.coil.v, DESK.y - .1);
    carriage.position.copy(cp); railX.position.z = cp.z; railY.position.x = cp.x;
    coil.material.emissiveIntensity = desk.charge === "charging" ? .6 + .3 * Math.sin(t * 3) : desk.charge === "seeking" ? .3 : 0;
    deskGlow.position.set(cp.x, DESK.y - .04, cp.z); deskGlow.intensity = desk.focus ? .05 : desk.charge === "idle" ? .12 : .45;
    drawOled(t); drawPhone(t);

    // Head
    const ease = Math.min(1, dt * 2.2);
    head.pos.lerp(want.pos, ease); head.look.lerp(want.look, ease);
    if (!drag.down) { drag.yaw *= .985; drag.pitch *= .985; }
    const sway = REDUCED ? 0 : 1;
    camera.position.copy(head.pos);
    camera.position.y += Math.sin(t * 1.3) * .004 * sway;       // breathing
    camera.lookAt(head.look);
    camera.rotation.order = "YXZ";
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
    e.y += drag.yaw + Math.sin(t * .37) * .018 * sway + Math.sin(t * .91) * .006 * sway;
    e.x += drag.pitch + Math.sin(t * .53) * .012 * sway;
    e.z = Math.sin(t * .29) * .006 * sway;
    camera.quaternion.setFromEuler(e);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------- HUD (the lens display) ----------------
  const hudEl = $("hud");
  let run = 0;                         // bumps to cancel a running script
  const sleep = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === run ? res() : rej("cancel")), REDUCED ? Math.min(ms, 300) : ms));
  function clock() { return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(new Date()); }
  let seatedMin = 12;
  function status() {
    const p = [clock(), `seated ${seatedMin}m`];
    if (desk.charge === "charging") p.push(`phone ${Math.round(desk.pct)}%`);
    if (desk.focus) p.push("FOCUS");
    return p.join("  |  ");
  }
  function setLines(lines) {
    hudEl.innerHTML = "";
    for (const l of lines) addLine(l, false);
  }
  function addLine(l, animate = true) {
    const d = document.createElement("div");
    const o = typeof l === "string" ? { text: l } : l;
    d.className = "ln" + (o.cls ? " " + o.cls : "") + (animate ? " new" : "");
    d.textContent = o.text ?? "";
    hudEl.appendChild(d);
    if (animate) requestAnimationFrame(() => requestAnimationFrame(() => d.classList.remove("new")));
    while (hudEl.children.length > 8) hudEl.firstChild.remove();
    return d;
  }
  async function typeLine(text, id, cls = "", cps = 38) {
    const d = addLine({ text: "", cls: (cls + " caret").trim() });
    for (let i = 1; i <= text.length; i++) { d.textContent = text.slice(0, i); await sleep(1000 / cps + (text[i - 1] === "," ? 90 : 0), id); }
    d.classList.remove("caret"); return d;
  }
  function reading(on) { document.body.classList.toggle("reading", on); }
  function say(html) { const s = $("say"); if (!html) { s.classList.add("hide"); return; } s.innerHTML = html; s.classList.remove("hide"); }
  function ring(text) { const r = $("ring"); if (!text) { r.classList.add("hide"); return; } $("ringText").textContent = text; r.classList.remove("hide"); }
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  async function listen(words, id) {
    // You speak; the G2 mic array picks it up and the transcript streams onto the lens.
    reading(true);
    setLines([{ text: status(), cls: "dim" }, "", { text: "◉ Listening", cls: "dim" }]);
    say(`<b>You:</b> “${esc(words)}”`);
    const d = addLine({ text: "", cls: "caret" });
    const parts = words.split(" ");
    for (let i = 1; i <= parts.length; i++) { d.textContent = parts.slice(0, i).join(" "); await sleep(170 + Math.random() * 90, id); }
    d.classList.remove("caret"); await sleep(500, id);
    say("");
  }
  async function idle(id, ms = 2600) {
    reading(false);
    setLines([{ text: status(), cls: "dim" }, "", desk.charge === "charging" ? "Phone charging on desk." : "All clear.", "", { text: "Ask, or tap the ring.", cls: "dim" }]);
    const end = performance.now() + ms;
    while (performance.now() < end) { await sleep(1000, id); if (hudEl.firstChild) hudEl.firstChild.textContent = status(); }
  }

  // ---------------- Commands ----------------
  const COMMANDS = {
    async phone(id, words = "Eclipse, find my phone and charge it.") {
      await listen(words, id);
      setLines([{ text: "Eclipse", cls: "dim" }]);
      await typeLine("Scanning the desk…", id);
      desk.charge = "seeking"; desk.msg = "";
      glance(uv2w(.4, .55, DESK.y), new THREE.Vector3(0, 1.24, .46));
      for (let s = 0; s <= 1; s += .02) { desk.scan = s; await sleep(22, id); }
      desk.scan = -1;
      await typeLine("Phone found, left of the keyboard.", id);
      desk.target = { u: PHONE_UV.u, v: PHONE_UV.v };
      glance(uv2w(PHONE_UV.u + .05, PHONE_UV.v, DESK.y));
      await typeLine("Moving the coil under it ▸▸▸", id);
      while (desk.target) await sleep(100, id);
      desk.charge = "charging"; desk.pct = 41;
      await typeLine(`Aligned. Charging, ${Math.round(desk.pct)}%.`, id);
      await typeLine("Full in about 55 min.", id, "dim");
      await sleep(2200, id); homeView(); await sleep(1600, id);
    },
    async next(id, words = "What's next on my list?") {
      await listen(words, id);
      const items = ["Review 3 videos · Systems Design", "Order gantry belts + Qi coil", "Water · 2 of 8 glasses"];
      const show = (sel) => setLines([{ text: "Next up", cls: "dim" }, "", ...items.map((t, i) => ({ text: `${i + 1}  ${t}`, cls: i === sel ? "sel" : "dim" })), "", { text: `${sel + 1}/${items.length}  tap: next  hold: done`, cls: "dim" }]);
      setLines([{ text: "Next up", cls: "dim" }, ""]);
      for (let i = 0; i < items.length; i++) await typeLine(`${i + 1}  ${items[i]}`, id, i === 0 ? "sel" : "dim", 60);
      await sleep(1600, id);
      for (const sel of [1, 2]) { ring("R1 ring · tap"); show(sel); await sleep(1500, id); }
      ring("R1 ring · hold"); setLines([{ text: "Next up", cls: "dim" }, "", { text: "✓  Water logged · 3 of 8", cls: "" }, "", { text: "Nice. Next reminder in 45 min.", cls: "dim" }]);
      await sleep(2400, id); ring("");
    },
    async focus(id, words = "Focus mode, twenty-five minutes.") {
      ring("R1 ring · double tap"); await sleep(900, id); ring("");
      await listen(words, id);
      setLines([{ text: "Eclipse", cls: "dim" }]);
      await typeLine("Focus on. Notifications held.", id);
      await typeLine("Desk glass dimmed.", id, "dim");
      desk.focus = true; await sleep(1200, id);
      reading(false);
      for (let s = 25 * 60; s > 25 * 60 - 7; s--) {
        setLines([{ text: status(), cls: "dim" }, "", { text: `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`, cls: "big" }, "", { text: "focus · 2 messages held", cls: "dim" }]);
        await sleep(1000, id);
      }
      ring("R1 ring · double tap"); desk.focus = false;
      setLines([{ text: "Eclipse", cls: "dim" }, "", "Focus off. 2 held messages.", { text: "Swipe to read them.", cls: "dim" }]);
      await sleep(2200, id); ring("");
    },
    async stand(id) {
      seatedMin = 50; reading(true);
      setLines([{ text: status(), cls: "dim" }, "", { text: "!! Seated 50 min.", cls: "urgent" }, { text: "Stand, stretch, drink water.", cls: "urgent" }]);
      desk.nudge = true; await sleep(3200, id);
      say("<b>You</b> stand up"); want.pos.set(0, 1.62, .55); want.look.set(0, 1.05, -.9);
      await sleep(2400, id); desk.nudge = false; seatedMin = 0; say("");
      setLines([{ text: status(), cls: "dim" }, ""]);
      await typeLine("Nice. Sitting timer reset.", id);
      await typeLine("Mug's on the right. 3 of 8 today.", id, "dim");
      glance(uv2w(.86, .6, DESK.y + .06), new THREE.Vector3(0, 1.6, .5));
      await sleep(2400, id); homeView(); await sleep(1200, id);
    },
    async ask(id, words) {
      const w = words.toLowerCase();
      if (/phone|charg|battery/.test(w)) return COMMANDS.phone(id, words);
      if (/next|list|todo|to-do|agenda|task/.test(w)) return COMMANDS.next(id, words);
      if (/focus|quiet|deep work|do not disturb/.test(w)) return COMMANDS.focus(id, words);
      if (/stand|break|water|stretch/.test(w)) return COMMANDS.stand(id);
      await listen(words, id);
      setLines([{ text: "Eclipse", cls: "dim" }]);
      await typeLine("I can drive the desk and your list.", id);
      await typeLine("Try: phone, what's next, focus, stand.", id, "dim");
      await sleep(2600, id);
    },
  };

  async function start(fn) {
    const id = ++run; say(""); ring("");
    try { await fn(id); await idle(id, 1e9); } catch (e) { if (e !== "cancel") throw e; }
  }
  async function demo(id) {
    await idle(id, 2400);
    for (;;) {
      await COMMANDS.phone(id); await idle(id, 2200);
      await COMMANDS.next(id); await idle(id, 2000);
      await COMMANDS.focus(id); await idle(id, 2000);
      await COMMANDS.stand(id); await idle(id, 3000);
      desk.charge = "idle"; desk.coil = { u: .7, v: .42 }; seatedMin = 12;
    }
  }
  $("demo").addEventListener("click", () => start(demo));
  document.querySelectorAll("[data-cmd]").forEach((b) => b.addEventListener("click", () => start((id) => COMMANDS[b.dataset.cmd](id))));
  $("ask").addEventListener("submit", (e) => {
    e.preventDefault(); const v = $("askInput").value.trim(); if (!v) return; $("askInput").value = "";
    start((id) => COMMANDS.ask(id, v));
  });

  // Open in a working state: the demo plays from the first frame.
  setLines([{ text: status(), cls: "dim" }, "", "All clear.", "", { text: "Ask, or tap the ring.", cls: "dim" }]);
  start(demo);
})();
</script>
