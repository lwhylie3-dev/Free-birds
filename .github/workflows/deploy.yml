name: Check and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (see docs/SETUP.md)."
            exit 1
          fi

      - name: Find or create the D1 database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="noxara-yt") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create noxara-yt
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="noxara-yt") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_ID/$id/" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply noxara-yt --remote

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Sync secrets
        run: |
          umask 077
          # APP_SECRET is generated once on Cloudflare and never leaves it.
          if ! npx wrangler secret list | grep -q '"APP_SECRET"'; then
            echo "Generating APP_SECRET"
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put APP_SECRET
          fi
          jq -n '{GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET, OWNER_EMAIL: env.OWNER_EMAIL}
                 | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/secrets.json"
          if [ "$(jq length "$RUNNER_TEMP/secrets.json")" -gt 0 ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET OWNER_EMAIL; do
            [ -n "${!name}" ] || echo "::warning::$name is not set yet; Google sign-in won't work until you add it (docs/SETUP.md step 3)."
          done
